name: Release

# Cut a release by pushing a version tag (commitizen does this via `cz bump`):
#   cz bump && git push --follow-tags
#
# PyPI uploads carry PEP 740 digital attestations (provenance) — cryptographic
# proof, the same idea as npm provenance, that each artifact was built from
# this repository by this workflow. PyPI shows this on the project page.
#
# Prerequisites (one-time):
#   * PyPI Trusted Publishing: register this repo, workflow `release.yml`, and
#     environment `pypi` as a trusted publisher for the `verso-mcp` project at
#     https://pypi.org/manage/ — and create the `pypi` environment under the
#     repository's Settings > Environments.
#   * MCP registry: fill the namespace placeholder in `server.json` (and the
#     `mcp-name` marker in README.md). With an `io.github.<owner>/...` name, the
#     `registry` job authenticates via GitHub OIDC — no secret needed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verso-mcp
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI with provenance attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Generate PEP 740 provenance attestations. Default on v1.11+; set
          # explicitly so the supply-chain guarantee is visible in the workflow.
          attestations: true

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MCP registry GitHub OIDC auth
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Check server.json is configured
        id: guard
        run: |
          if grep -q YOUR_GITHUB_USERNAME server.json; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::server.json still has the namespace placeholder; skipping MCP registry publish."
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mcp-publisher
        if: steps.guard.outputs.ready == 'yes'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Sync server.json version to the tag
        if: steps.guard.outputs.ready == 'yes'
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Publish to the MCP registry
        if: steps.guard.outputs.ready == 'yes'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
