name: xref canary

# Drift alarm for Verso's undocumented xref.json format. The offline test suite
# checks verso-mcp against a synthetic fixture, so it cannot detect an upstream
# format change. This job exercises the live Lean Language Reference end to end;
# if it fails, the format has likely drifted (see AGENTS.md, "Upstream format
# drift"). A failed scheduled run notifies the repository owner by default.

on:
  schedule:
    - cron: "0 7 * * 1"  # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Live xref.json contract test
        run: uv run pytest -m live -v
