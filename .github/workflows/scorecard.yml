name: Scorecard

# OpenSSF Scorecard — scores the repository's supply-chain security posture.
# Results land in the Security tab (no PRs, no email noise) and, with
# publish_results, on the public OpenSSF API. publish_results requires a
# public repository.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  push:
    branches: [main]
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload SARIF results to the Security tab
      id-token: write         # publish results to the OpenSSF Scorecard API
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
