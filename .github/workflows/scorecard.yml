name: Scorecard

# OpenSSF Scorecard — scores the repository's supply-chain security posture.
# Results land in the Security tab (no PRs, no email noise) and, with
# publish_results, on the public OpenSSF API. publish_results requires a
# public repository.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  push:
    branches: [main]
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload SARIF results to the Security tab
      id-token: write         # publish results to the OpenSSF Scorecard API
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
