[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "verso-mcp"
dynamic = ["version"]
description = "MCP server for Verso-generated documentation sites (the Lean Language Reference, Functional Programming in Lean, and other Verso Manual-genre sites)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "N. V. Lang", email = "git@nvlang.dev" }]
keywords = ["mcp", "model-context-protocol", "verso", "lean", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp[cli]>=1.27.1",
    "httpx>=0.27",
    "html2text>=2024.2.26",
    "pydantic>=2",
]

[project.urls]
Repository = "https://github.com/nvlang/verso-mcp"
Issues = "https://github.com/nvlang/verso-mcp/issues"

[project.scripts]
verso-mcp = "verso_mcp:main"

[tool.hatch.version]
path = "src/verso_mcp/server.py"

[tool.hatch.build.targets.wheel]
packages = ["src/verso_mcp"]

[dependency-groups]
dev = ["ruff", "commitizen", "pre-commit", "pytest>=8", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `asyncio_mode = "auto"` lets `async def test_*` run without a per-test marker.
asyncio_mode = "auto"
# Network tests are opt-in: the default run (and CI's `quality` job) stays
# offline and deterministic. The canary workflow runs them with `-m live`.
addopts = ["-m", "not live"]
markers = [
    "live: end-to-end test against the live Lean Language Reference; excluded by default, run by the canary workflow",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.4.2"
version_files = ["src/verso_mcp/server.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
annotated_tag = true
gpg_sign = true
major_version_zero = true
changelog_file = "CHANGELOG.md"
